name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        # The Vercel adapter builds only on Node 20, 22 or 24, so this tracks
        # the Node version the site deploys on rather than the newest LTS.
        node-version: 24
    - name: Install marketing site dependencies
      working-directory: ./marketing
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./marketing
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./marketing
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: marketing/playwright-report/
        retention-days: 30
