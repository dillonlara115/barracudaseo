name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    # Pinned to the last environment this job passed on (Ubuntu 24.04, Node 24).
    # Playwright 1.57 cannot install browsers on Ubuntu 26.04, and its browser
    # install hangs after the download on Node 26. Return to ubuntu-latest and
    # lts/* after upgrading Playwright.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install marketing site dependencies
      working-directory: ./marketing
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./marketing
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./marketing
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: marketing/playwright-report/
        retention-days: 30
